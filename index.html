  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Hidden form for Netlify's build-time form detection.
      Netlify's bot scans static HTML at deploy time — it cannot see JSX.
      This mirrors the fields in ContactForm.tsx exactly so Netlify registers
      the form and routes submissions to the dashboard / email notifications.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text"   name="bot-field" />
      <input type="text"   name="firstName" />
      <input type="email"  name="email" />
      <input type="tel"    name="phone" />
      <input type="text"   name="service" />
      <textarea            name="message"></textarea>
    </form>
  </body>
